## ============================================================
## 采购域指标（14 个）
## domain: PROCUREMENT
## ============================================================
domain: PROCUREMENT
version: 1
extends: [_common.yaml, _dimensions.yaml]

metrics:

  - { name: purchase_amount, label: 采购金额, code: M075,
      fact: dws_purchase_daily, formula: SUM(po_amount), format: amount }

  - { name: purchase_tonnage, label: 采购吨数, code: M076,
      fact: dws_purchase_daily, formula: SUM(po_tonnage), format: ton }

  - { name: avg_purchase_price, label: 平均采购吨价, code: M077,
      fact: dws_purchase_daily,
      formula: "SUM(po_amount)/NULLIF(SUM(po_tonnage),0)",
      format: price }

  - { name: purchase_price_vs_index, label: 采购吨价对指数差, code: M078,
      fact: dws_purchase_daily, join: [dim_steel_index],
      formula: "AVG(po_amount/NULLIF(po_tonnage,0)) - AVG(idx_price)",
      format: price, applicable: [TRADE, MILL] }

  - { name: receipt_tonnage, label: 到货吨数, code: M079,
      fact: dws_purchase_daily, formula: SUM(received_tonnage), format: ton }

  - { name: supplier_count, label: 供应商数, code: M080,
      fact: dws_purchase_daily,
      formula: COUNT(DISTINCT supplier_id), format: count }

  - { name: supplier_otd, label: 供应商准交率, code: M081,
      fact: dws_purchase_daily,
      formula: "SUM(on_time_receipt_tonnage)/NULLIF(SUM(promise_tonnage),0)",
      format: percent }

  - { name: supplier_quality_pass, label: 来料合格率, code: M082,
      fact: dws_iqc_daily,
      formula: "SUM(pass_tonnage)/NULLIF(SUM(insp_tonnage),0)",
      format: percent }

  - { name: supplier_concentration_top10, label: Top10供应商占比, code: M083,
      fact: dws_purchase_daily,
      formula: "topn_ratio(po_amount, supplier_id, 10)",
      format: percent, semantics: virtual }

  - { name: lead_time_avg, label: 平均到货周期, code: M084,
      fact: dws_purchase_daily, formula: AVG(lead_days), format: days }

  - { name: iqc_reject_rate, label: IQC拒收率, code: M085,
      fact: dws_iqc_daily,
      formula: "SUM(reject_tonnage)/NULLIF(SUM(insp_tonnage),0)",
      format: percent }

  - { name: po_overdue_rate, label: 采购单逾期率, code: M086,
      fact: dws_purchase_daily,
      formula: "SUM(overdue_po)/NULLIF(SUM(po_count),0)",
      format: percent }

  - { name: ap_outstanding, label: 应付账款余额, code: M087,
      fact: dws_ap_snapshot, formula: SUM(ap_amount),
      semantics: snapshot, time_agg: last, format: amount }

  - { name: dpo, label: 应付周转天数, code: M088,
      fact: dws_ap_snapshot,
      formula: "AVG(ap_amount)*days_in_period/NULLIF(SUM(po_amount),0)",
      requires_metrics: [purchase_amount], format: days }
