## Bandit 配置 - 排除测试与已知安全的 dev fixtures
exclude_dirs:
  - tests
  - .venv
  - apps/registry-web/node_modules
  - apps/uniapp-briefing/node_modules
  - services/*/.venv

skips:
  # B101 = assert_used - 测试用断言
  - B101
  # B104 = hardcoded_bind_all - 0.0.0.0 在容器内是有意的
  - B104
  # B311 = random - 我们用 random 仅做演示数据生成
  - B311
  # B608 = SQL 字符串拼接 - 内部受控 (表名拼接, 不是用户输入),
  #        所有用户参数都已通过 SQLAlchemy text() 参数化
  - B608
