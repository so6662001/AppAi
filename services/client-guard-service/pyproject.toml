[project]
name = "client-guard-service"
version = "0.1.0"
description = "ERP 客户端防 RPA 服务端 - 策略下发 / 遥测接收与独立评分 / 导出配额与审批 token"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111", "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0", "pymysql>=1.1",
    "pydantic>=2.0", "httpx>=0.27",
    "prometheus-client>=0.20",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../_shared"]
