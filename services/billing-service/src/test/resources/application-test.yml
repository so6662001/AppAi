spring:
  datasource:
    url: jdbc:h2:mem:billing;MODE=MySQL;DATABASE_TO_LOWER=FALSE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

billing:
  lua-dir: /tmp/nonexistent           # 强制 fallback 到 classpath 占位脚本

logging:
  level:
    com.steel.billing: DEBUG
