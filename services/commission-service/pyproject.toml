[project]
name = "commission-service"
version = "0.1.0"
description = "钢铁行业租户级提成引擎 - 真实数字默认模板 + 完全可配置规则"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111", "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0", "pymysql>=1.1",
    "pydantic>=2.0", "httpx>=0.27",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../_shared"]
