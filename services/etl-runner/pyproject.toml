[project]
name = "etl-runner"
version = "0.1.0"
description = "通用 ETL 任务执行器 (库存日快照/DWS 聚合等)"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10", "pymysql>=1.1", "fastapi>=0.111",
    "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
