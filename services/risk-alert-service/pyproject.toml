[project]
name = "risk-alert-service"
version = "0.1.0"
description = "Steel AI Analytics - 风控告警引擎"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10",
    "PyYAML>=6.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
