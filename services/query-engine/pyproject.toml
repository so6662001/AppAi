[project]
name = "query-engine"
version = "0.1.0"
description = "统一 SQL 查询引擎 + L1/L2 缓存 + 权限审计"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111", "uvicorn[standard]>=0.30",
    "pymysql>=1.1", "redis>=5.0", "httpx>=0.27", "pydantic>=2.7",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "fakeredis>=2.20"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
