[project]
name = "role-insight-service"
version = "0.1.0"
description = "岗位智能画像 - 健康度评分 + 短板诊断 + 行动建议 + 钻取推荐"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111", "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0", "pymysql>=1.1",
    "pydantic>=2.0", "PyYAML>=6.0", "httpx>=0.27",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../_shared"]
