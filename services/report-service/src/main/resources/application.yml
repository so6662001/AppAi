server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: report-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/steel_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4}
    username: ${DB_USER:root}
    password: ${DB_PASS:steeldev}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  jackson:
    default-property-inclusion: NON_NULL
    serialization:
      write-dates-as-timestamps: false

scheduler:
  base-url: ${SCHEDULER_URL:http://localhost:8100}

logging:
  level:
    com.steel.report: INFO
    org.springframework: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
