spring:
  datasource:
    url: jdbc:h2:mem:steel;MODE=MySQL;DATABASE_TO_LOWER=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

scheduler:
  base-url: http://localhost:9999     # 测试时不可达, runNow 返回 error 字段但接口仍 202

logging:
  level:
    com.steel.report: DEBUG
