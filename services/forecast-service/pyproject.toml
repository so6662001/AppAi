[project]
name = "forecast-service"
version = "0.1.0"
description = "Steel AI Analytics - 预测服务"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "apscheduler>=3.10",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
# Prophet 安装较重 (依赖 cmdstan), 设为可选
prophet = ["prophet>=1.1"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
