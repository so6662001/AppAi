## ============================================================
## 质量检验 SQL Server → StarRocks
## 调度: 每 15 分钟
## ============================================================

env {
  parallelism = 2
  job.mode    = "BATCH"
  job.name    = "quality_inspection_incremental"
  sync_window_from = "${SYNC_FROM:-2018-01-01 00:00:00}"
  sync_window_to   = "${SYNC_TO:-2099-01-01 00:00:00}"
  tenant_id        = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "raw_quality"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://${MSSQL_HOST}:${MSSQL_PORT};databaseName=${MSSQL_DB};encrypt=false"
    user = "${MSSQL_USER}"
    password = "${MSSQL_PASS}"
    partition_column = "InspID"
    partition_num = 4
    query = """
      SELECT
        ${tenant_id}             AS tenant_id,
        q.InspID                 AS insp_id,
        CAST(q.InspDate AS DATE) AS insp_date,
        q.Source                 AS source,
        q.Category               AS category,
        q.MaterialID             AS material_id,
        m.OriginID               AS origin_id,
        m.GradeCode              AS grade_code,
        q.SupplierID             AS supplier_id,
        q.WoID                   AS wo_id,
        q.WorkcenterID           AS workcenter_id,
        q.DefectID               AS defect_id,
        q.TotalQty               AS total_qty,
        q.DefectQty              AS defect_qty,
        q.DefectTonnage          AS defect_tonnage,
        q.Pass                   AS pass,
        q.DowngradeTonnage       AS downgrade_tonnage,
        q.LastModifiedTime       AS src_update_time
      FROM dbo.QualityInspection q
      LEFT JOIN dbo.Material m ON m.MaterialID = q.MaterialID
      WHERE q.LastModifiedTime >= '${sync_window_from}'
        AND q.LastModifiedTime <  '${sync_window_to}'
    """
  }
}

sink {
  StarRocks {
    plugin_input = "raw_quality"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dwd_quality_inspection"
    batch_max_rows = 30000
    starrocks.config = { format = "JSON", strip_outer_array = "true" }
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
