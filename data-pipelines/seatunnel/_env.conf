## ============================================================
## SeaTunnel 共享配置(用 ${VAR} 注入到各任务 conf)
## 通过 -i 参数注入: seatunnel.sh --config xxx.conf -i tenant_id=1
## ============================================================

## SQL Server 业务库
mssql.host       = ${MSSQL_HOST:-127.0.0.1}
mssql.port       = ${MSSQL_PORT:-1433}
mssql.database   = ${MSSQL_DB:-ERP_PROD}
mssql.user       = ${MSSQL_USER:-readonly}
mssql.password   = ${MSSQL_PASS:-}

## StarRocks 数仓
starrocks.fe.nodes      = ${SR_FE_NODES:-127.0.0.1:8030}
starrocks.fe.jdbc.url   = ${SR_FE_JDBC:-jdbc:mysql://127.0.0.1:9030/steel_dw}
starrocks.user          = ${SR_USER:-etl_writer}
starrocks.password      = ${SR_PASS:-}
starrocks.database      = ${SR_DB:-steel_dw}

## 多租户
tenant.id        = ${TENANT_ID:-1}
