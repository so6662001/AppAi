## ============================================================
## 库存日快照 物化 (StarRocks 内部 ETL)
## 每天 00:30 凌晨 全量重算昨日快照, 写入 dws_inv_daily_snapshot
## 关键: 即使无变动也写一行, 跨日 AVG 才正确
## ============================================================

env {
  parallelism = 4
  job.mode    = "BATCH"
  job.name    = "dws_inv_daily_snapshot"
  snap_date   = "${SNAP_DATE:-yesterday}"
  tenant_id   = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "inv_snap"
    driver = "com.mysql.cj.jdbc.Driver"
    url    = "${SR_FE_JDBC}"
    user   = "${SR_USER}"
    password = "${SR_PASS}"
    query = """
      WITH today_inv AS (
        SELECT
          tenant_id, warehouse_id, warehouse_type, material_id,
          origin_id, grade_code,
          SUM(on_hand_qty)      AS on_hand_qty,
          SUM(on_hand_tonnage)  AS on_hand_tonnage,
          COUNT(DISTINCT coil_no) AS coil_count,
          SUM(amount)           AS amount,
          AVG(unit_cost)        AS avg_cost_price,
          DATEDIFF('${snap_date}', MIN(last_in_date))   AS aging_days,
          DATEDIFF('${snap_date}', MAX(last_move_date)) AS last_move_days
        FROM dwd_inv_balance
        WHERE tenant_id = ${tenant_id}
        GROUP BY tenant_id, warehouse_id, warehouse_type, material_id, origin_id, grade_code
      )
      SELECT
        ti.tenant_id,
        CAST('${snap_date}' AS DATE)             AS snap_date,
        w.org_id                                  AS org_id,
        ti.warehouse_id, ti.warehouse_type,
        ti.material_id, ti.origin_id, ti.grade_code,
        m.product_type                            AS product_type,
        ti.on_hand_qty, ti.on_hand_tonnage, ti.coil_count, ti.amount,
        ti.avg_cost_price,
        ti.aging_days,
        -- 库龄分桶
        CASE WHEN ti.aging_days BETWEEN 0   AND 30   THEN ti.amount ELSE 0 END AS aging_0_30,
        CASE WHEN ti.aging_days BETWEEN 31  AND 90   THEN ti.amount ELSE 0 END AS aging_31_90,
        CASE WHEN ti.aging_days BETWEEN 91  AND 180  THEN ti.amount ELSE 0 END AS aging_91_180,
        CASE WHEN ti.aging_days BETWEEN 181 AND 365  THEN ti.amount ELSE 0 END AS aging_181_365,
        CASE WHEN ti.aging_days > 365                THEN ti.amount ELSE 0 END AS aging_365_plus,
        ti.last_move_days,
        m.safety_stock                            AS safety_stock,
        d30.demand_30d                            AS demand_30d,
        NOW()                                     AS src_update_time
      FROM today_inv ti
      LEFT JOIN dim_warehouse w     ON w.tenant_id = ti.tenant_id AND w.warehouse_id = ti.warehouse_id
      LEFT JOIN dim_material_his m  ON m.tenant_id = ti.tenant_id AND m.material_id  = ti.material_id AND m.is_current = 1
      LEFT JOIN (
        SELECT tenant_id, material_id, SUM(order_tonnage) AS demand_30d
        FROM dws_sales_daily
        WHERE biz_date BETWEEN DATE_SUB('${snap_date}', INTERVAL 30 DAY) AND '${snap_date}'
        GROUP BY tenant_id, material_id
      ) d30 ON d30.tenant_id = ti.tenant_id AND d30.material_id = ti.material_id
    """
  }
}

sink {
  StarRocks {
    plugin_input = "inv_snap"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dws_inv_daily_snapshot"
    batch_max_rows = 50000
    starrocks.config = { format = "JSON", strip_outer_array = "true" }
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
