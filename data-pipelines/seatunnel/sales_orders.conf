## ============================================================
## 销售订单行 SQL Server → StarRocks 增量同步
## 调度: 每 5 分钟
## 增量基线: LastModifiedTime (业务库表必须有这列, 建议加索引)
## 全量初始化时把 sync_window_from 设为 2018-01-01
## ============================================================

env {
  parallelism = 4
  job.mode    = "BATCH"
  job.name    = "sales_orders_incremental"
  checkpoint.interval = 60000

  ## 由调度器(DolphinScheduler/Airflow)注入
  ## 上一次成功的 max(LastModifiedTime), 落地在状态表
  sync_window_from = "${SYNC_FROM:-2018-01-01 00:00:00}"
  sync_window_to   = "${SYNC_TO:-2099-01-01 00:00:00}"
  tenant_id        = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "raw_sales_orders"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://${MSSQL_HOST}:${MSSQL_PORT};databaseName=${MSSQL_DB};encrypt=false"
    user = "${MSSQL_USER}"
    password = "${MSSQL_PASS}"

    ## SQL Server 2008 不支持 OFFSET/FETCH, 用单查询 + 应用层分批
    ## partition_column 用于 SeaTunnel 自动并发拆分
    partition_column = "OrderID"
    partition_num = 4

    query = """
      SELECT
        ${tenant_id}                              AS tenant_id,
        sol.OrderID                               AS order_id,
        sol.LineNo                                AS line_no,
        so.OrderNo                                AS order_no,
        CAST(so.OrderDate AS DATE)                AS order_date,
        so.CustomerID                             AS customer_id,
        so.OrgID                                  AS org_id,
        so.SalesOwnerID                           AS sales_owner_id,
        sol.MaterialID                            AS material_id,
        m.OriginID                                AS origin_id,
        m.GradeCode                               AS grade_code,
        m.ProductType                             AS product_type,
        m.SpecThk                                 AS spec_thk,
        m.SpecWid                                 AS spec_wid,
        sol.Qty                                   AS qty,
        sol.Tonnage                               AS tonnage,
        sol.UnitPrice                             AS unit_price,
        sol.AmountExclTax                         AS amount_excl_tax,
        sol.TaxAmount                             AS tax_amount,
        sol.AmountInclTax                         AS amount_incl_tax,
        sol.CostAmount                            AS cost_amount,
        sol.CostPrice                             AS cost_price,
        ISNULL(pl.ListedPrice, 0)                 AS listed_price_snapshot,
        sol.PromiseDate                           AS promise_date,
        sol.DeliveredQty                          AS delivered_qty,
        sol.DeliveredTonnage                      AS delivered_tonnage,
        sol.DeliveredDate                         AS delivered_date,
        sol.Status                                AS status,
        ISNULL(sol.CancelFlag, 0)                 AS cancel_flag,
        sol.LastModifiedTime                      AS src_update_time,
        GETDATE()                                 AS etl_load_time
      FROM dbo.SalesOrderLine sol
      INNER JOIN dbo.SalesOrder so
              ON so.OrderID = sol.OrderID
      LEFT JOIN dbo.Material m
              ON m.MaterialID = sol.MaterialID
      LEFT JOIN dbo.PriceListDaily pl
              ON pl.OriginID    = m.OriginID
             AND pl.GradeCode   = m.GradeCode
             AND pl.SpecThk     = m.SpecThk
             AND pl.SpecWid     = m.SpecWid
             AND pl.ProductType = m.ProductType
             AND pl.PriceDate   = CAST(so.OrderDate AS DATE)
      WHERE sol.LastModifiedTime >= '${sync_window_from}'
        AND sol.LastModifiedTime <  '${sync_window_to}'
    """
  }
}

transform {
  Sql {
    plugin_input  = "raw_sales_orders"
    plugin_output = "cleaned_sales_orders"
    query = """
      SELECT
        tenant_id, order_id, line_no, order_no,
        order_date, customer_id, org_id, sales_owner_id,
        material_id, origin_id, grade_code, product_type,
        spec_thk, spec_wid,
        qty,
        COALESCE(tonnage, 0)            AS tonnage,
        unit_price,
        amount_excl_tax, tax_amount, amount_incl_tax,
        COALESCE(cost_amount, 0)        AS cost_amount,
        cost_price,
        listed_price_snapshot,
        promise_date,
        COALESCE(delivered_qty, 0)      AS delivered_qty,
        COALESCE(delivered_tonnage, 0)  AS delivered_tonnage,
        delivered_date,
        UPPER(COALESCE(status, ''))     AS status,
        cancel_flag,
        src_update_time, etl_load_time
      FROM raw_sales_orders
      WHERE order_id IS NOT NULL
    """
  }
}

sink {
  StarRocks {
    plugin_input = "cleaned_sales_orders"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dwd_sales_order_line"
    batch_max_rows  = 50000
    batch_max_bytes = 134217728   # 128MB
    max_retries     = 3
    starrocks.config = {
      format          = "JSON"
      strip_outer_array = "true"
      ## 主键模型 upsert
      partial_update  = "false"
    }
    ## 写入完成事件 → Kafka, 让下游 DWS ETL 触发
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
