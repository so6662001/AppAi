## ============================================================
## 库存流水 (txn) → dws_inv_movement_daily 聚合
## 每 15 分钟跑一次
## ============================================================

env {
  parallelism = 4
  job.mode    = "BATCH"
  job.name    = "inv_movement_aggregate"
  sync_window_from = "${SYNC_FROM:-2018-01-01 00:00:00}"
  sync_window_to   = "${SYNC_TO:-2099-01-01 00:00:00}"
  tenant_id        = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "raw_inv_txn"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://${MSSQL_HOST}:${MSSQL_PORT};databaseName=${MSSQL_DB};encrypt=false"
    user = "${MSSQL_USER}"
    password = "${MSSQL_PASS}"
    partition_column = "TxnID"
    partition_num = 4
    query = """
      SELECT
        ${tenant_id} AS tenant_id,
        CAST(t.BizDate AS DATE)        AS biz_date,
        t.OrgID                        AS org_id,
        t.WarehouseID                  AS warehouse_id,
        t.MaterialID                   AS material_id,
        m.OriginID                     AS origin_id,
        m.GradeCode                    AS grade_code,
        CASE t.TxnType
          WHEN 'PURCHASE_IN'         THEN 'PURCHASE_IN'
          WHEN 'PRODUCTION_IN'       THEN 'PRODUCTION_IN'
          WHEN 'CUSTOMER_RETURN_IN'  THEN 'CUSTOMER_RETURN_IN'
          WHEN 'SALES_OUT'           THEN 'SALES_OUT'
          WHEN 'PRODUCTION_OUT'      THEN 'PRODUCTION_OUT'
          WHEN 'SAMPLE_OUT'          THEN 'SAMPLE_OUT'
          WHEN 'SCRAP_OUT'           THEN 'SCRAP_OUT'
          WHEN 'RETURN_TO_SUPPLIER'  THEN 'RETURN_TO_SUPPLIER'
          WHEN 'TRANSFER_IN'         THEN 'TRANSFER_IN'
          WHEN 'TRANSFER_OUT'        THEN 'TRANSFER_OUT'
          WHEN 'ALLOC_IN'            THEN 'ALLOC_IN'
          WHEN 'ALLOC_OUT'           THEN 'ALLOC_OUT'
          WHEN 'INVENTORY_GAIN'      THEN 'INVENTORY_GAIN'
          WHEN 'INVENTORY_LOSS'      THEN 'INVENTORY_LOSS'
          ELSE 'OTHER'
        END                            AS txn_category,
        CASE
          WHEN t.TxnType LIKE '%_IN%' OR t.TxnType IN ('CUSTOMER_RETURN_IN','INVENTORY_GAIN')
          THEN 'IN' ELSE 'OUT'
        END                            AS direction,
        ABS(t.Tonnage)                 AS tonnage,
        ABS(t.Amount)                  AS amount,
        1                              AS txn_count,
        t.LastModifiedTime             AS src_update_time
      FROM dbo.InventoryTransaction t
      LEFT JOIN dbo.Material m ON m.MaterialID = t.MaterialID
      WHERE t.LastModifiedTime >= '${sync_window_from}'
        AND t.LastModifiedTime <  '${sync_window_to}'
    """
  }
}

transform {
  Sql {
    plugin_input  = "raw_inv_txn"
    plugin_output = "agg_inv_movement"
    query = """
      SELECT
        tenant_id, biz_date, org_id, warehouse_id, material_id,
        origin_id, grade_code, txn_category, direction,
        SUM(tonnage)  AS tonnage,
        SUM(amount)   AS amount,
        SUM(txn_count) AS txn_count
      FROM raw_inv_txn
      GROUP BY tenant_id, biz_date, org_id, warehouse_id, material_id,
               origin_id, grade_code, txn_category, direction
    """
  }
}

sink {
  StarRocks {
    plugin_input = "agg_inv_movement"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dws_inv_movement_daily"
    batch_max_rows = 50000
    starrocks.config = { format = "JSON", strip_outer_array = "true" }
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
