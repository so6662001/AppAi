## ============================================================
## 实时库存余额 SQL Server → StarRocks
## 调度: 每 5 分钟 (库存变更频繁)
## ============================================================

env {
  parallelism = 4
  job.mode    = "BATCH"
  job.name    = "inv_balance_incremental"
  checkpoint.interval = 60000
  sync_window_from = "${SYNC_FROM:-2018-01-01 00:00:00}"
  sync_window_to   = "${SYNC_TO:-2099-01-01 00:00:00}"
  tenant_id        = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "raw_inv_balance"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://${MSSQL_HOST}:${MSSQL_PORT};databaseName=${MSSQL_DB};encrypt=false"
    user = "${MSSQL_USER}"
    password = "${MSSQL_PASS}"
    partition_column = "MaterialID"
    partition_num = 4
    query = """
      SELECT
        ${tenant_id}                              AS tenant_id,
        ib.WarehouseID                            AS warehouse_id,
        w.WarehouseType                           AS warehouse_type,
        ib.MaterialID                             AS material_id,
        m.OriginID                                AS origin_id,
        m.GradeCode                               AS grade_code,
        ISNULL(ib.BatchNo, '')                    AS batch_no,
        ib.CoilNo                                 AS coil_no,
        ib.OnHandQty                              AS on_hand_qty,
        ib.OnHandTonnage                          AS on_hand_tonnage,
        ib.AvailableQty                           AS available_qty,
        ib.AvailableTonnage                       AS available_tonnage,
        ib.UnitCost                               AS unit_cost,
        ib.Amount                                 AS amount,
        ib.LastInDate                             AS last_in_date,
        ib.LastMoveDate                           AS last_move_date,
        ib.LastModifiedTime                       AS src_update_time,
        GETDATE()                                 AS etl_load_time
      FROM dbo.InventoryBalance ib
      INNER JOIN dbo.Warehouse  w ON w.WarehouseID = ib.WarehouseID
      LEFT  JOIN dbo.Material   m ON m.MaterialID  = ib.MaterialID
      WHERE ib.LastModifiedTime >= '${sync_window_from}'
        AND ib.LastModifiedTime <  '${sync_window_to}'
    """
  }
}

sink {
  StarRocks {
    plugin_input = "raw_inv_balance"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dwd_inv_balance"
    batch_max_rows = 50000
    starrocks.config = { format = "JSON", strip_outer_array = "true" }
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
