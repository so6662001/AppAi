## ============================================================
## 客户维 (Type 2 拉链表) SQL Server → StarRocks
## 调度: 每天 02:00 全量重算 (维表量小, 简化处理)
## ============================================================

env {
  parallelism = 2
  job.mode    = "BATCH"
  job.name    = "dim_customer_full_refresh"
  tenant_id   = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "raw_customer"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://${MSSQL_HOST}:${MSSQL_PORT};databaseName=${MSSQL_DB};encrypt=false"
    user = "${MSSQL_USER}"
    password = "${MSSQL_PASS}"
    query = """
      SELECT
        ${tenant_id}                AS tenant_id,
        c.CustomerID                AS customer_id,
        c.CustomerID * 1000 + 0     AS customer_sk,  -- 简化代理键
        c.CustomerCode              AS customer_code,
        c.CustomerName              AS customer_name,
        c.Industry                  AS industry,
        c.Region                    AS region,
        c.SalesOwnerID              AS sales_owner_id,
        c.Level                     AS level,
        cc.RiskGrade                AS risk_grade,
        cc.PaymentTermsDays         AS payment_terms_days,
        CAST('2000-01-01' AS DATE)  AS start_date,
        CAST('9999-12-31' AS DATE)  AS end_date,
        1                           AS is_current,
        GETDATE()                   AS etl_load_time
      FROM dbo.Customer c
      LEFT JOIN dbo.CustomerCredit cc
        ON cc.CustomerID = c.CustomerID
       AND cc.EffectiveTo IS NULL OR cc.EffectiveTo >= GETDATE()
      WHERE c.IsActive = 1
    """
  }
}

sink {
  StarRocks {
    plugin_input = "raw_customer"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dim_customer_his"
    starrocks.config = { format = "JSON", strip_outer_array = "true" }
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
