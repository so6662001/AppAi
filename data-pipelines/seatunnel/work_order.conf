## ============================================================
## MES 工单 SQL Server → StarRocks
## 适用 PROCESS / MILL 客户; TRADE 客户跳过此任务
## 调度: 每 10 分钟
## ============================================================

env {
  parallelism = 4
  job.mode    = "BATCH"
  job.name    = "work_order_incremental"
  sync_window_from = "${SYNC_FROM:-2018-01-01 00:00:00}"
  sync_window_to   = "${SYNC_TO:-2099-01-01 00:00:00}"
  tenant_id        = "${TENANT_ID:-1}"
}

source {
  Jdbc {
    plugin_output = "raw_wo"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://${MSSQL_HOST}:${MSSQL_PORT};databaseName=${MSSQL_DB};encrypt=false"
    user = "${MSSQL_USER}"
    password = "${MSSQL_PASS}"
    partition_column = "WoID"
    partition_num = 4
    query = """
      SELECT
        ${tenant_id}                          AS tenant_id,
        wo.WoID                               AS wo_id,
        wo.WoNo                               AS wo_no,
        wo.MaterialID                         AS material_id,
        m.OriginID                            AS origin_id,
        m.GradeCode                           AS grade_code,
        wo.WorkcenterID                       AS workcenter_id,
        wc.Process                            AS process,
        wo.PlanQty                            AS plan_qty,
        wo.PlanTonnage                        AS plan_tonnage,
        wo.GoodQty                            AS good_qty,
        wo.GoodTonnage                        AS good_tonnage,
        wo.ScrapQty                           AS scrap_qty,
        wo.ScrapTonnage                       AS scrap_tonnage,
        wo.ReworkTonnage                      AS rework_tonnage,
        wo.PlanStart                          AS plan_start,
        wo.PlanEnd                            AS plan_end,
        wo.ActualStart                        AS actual_start,
        wo.ActualEnd                          AS actual_end,
        wo.Status                             AS status,
        CASE WHEN wo.PlanEnd < GETDATE() AND wo.Status <> 'DONE'
             THEN 1 ELSE 0 END                AS is_overdue,
        wo.LastModifiedTime                   AS src_update_time
      FROM dbo.WorkOrder wo
      INNER JOIN dbo.Workcenter wc ON wc.WorkcenterID = wo.WorkcenterID
      LEFT  JOIN dbo.Material  m  ON m.MaterialID    = wo.MaterialID
      WHERE wo.LastModifiedTime >= '${sync_window_from}'
        AND wo.LastModifiedTime <  '${sync_window_to}'
    """
  }
}

sink {
  StarRocks {
    plugin_input = "raw_wo"
    nodeUrls = ["${SR_FE_NODES}"]
    base-url = "${SR_FE_JDBC}"
    username = "${SR_USER}"
    password = "${SR_PASS}"
    database = "${SR_DB}"
    table    = "dwd_work_order"
    batch_max_rows = 50000
    starrocks.config = { format = "JSON", strip_outer_array = "true" }
    schema_save_mode = "IGNORE"
    data_save_mode   = "APPEND_DATA"
  }
}
