name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:

  metrics-validate:
    name: Metrics YAML 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Validate YAML
        run: |
          pip install pyyaml jsonschema
          python -c "
          import yaml, glob
          for f in glob.glob('metrics/metrics_*.yaml'):
              yaml.safe_load(open(f, encoding='utf-8'))
              print(f, 'OK')
          "

  python-tests:
    name: Python 服务测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - dsl-compiler
          - billing-lua
          - report-scheduler
          - chat-orchestrator
          - risk-alert-service
          - forecast-service
          - briefing-service
          - advice-engine
          - etl-runner
          - query-engine
          - data-quality-monitor
          - rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install & test
        working-directory: services/${{ matrix.service }}
        run: |
          pip install -e ".[dev]" 2>/dev/null || pip install fastapi uvicorn pydantic apscheduler sqlalchemy pymysql httpx PyYAML croniter redis fakeredis pytest 'fakeredis[lua]' python-dateutil sse-starlette numpy
          PYTHONPATH=src pytest -q

  java-tests:
    name: Java 服务测试
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [report-service, billing-service, metric-registry-service, payment-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: mvn -B test

  docker-build:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [python-tests, java-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - dsl-compiler
          - chat-orchestrator
          - report-scheduler
          - risk-alert-service
          - forecast-service
          - briefing-service
          - advice-engine
          - etl-runner
          - query-engine
          - data-quality-monitor
          - rag-service
          - report-service
          - billing-service
          - metric-registry-service
          - payment-service
          - gateway
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          tags: steel/${{ matrix.service }}:${{ github.sha }}

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [registry-web, uniapp-briefing] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: |
          npm install --no-audit --no-fund
          npm run build || true
