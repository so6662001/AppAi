# =====================================================================
# Docker Compose · 开发/演示环境一键启动
# 适用: 本地走查 UI + 跑通 DSL 编译器 + Lua 测试
# 不包含: 业务系统 / Java 后端 / SeaTunnel (这些后续单独跑)
# 启动: docker compose -f docker-compose.dev.yml up -d
# =====================================================================
version: '3.8'

services:

  # ----------------------- 数据库 -----------------------
  starrocks:
    image: starrocks/allin1-ubuntu:3.2-latest
    container_name: steel-starrocks
    ports:
      - "9030:9030"   # MySQL 协议
      - "8030:8030"   # FE HTTP
      - "8040:8040"   # BE HTTP
    environment:
      - HOST_TYPE=FQDN
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW DATABASES;' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - sr_data:/data
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: steel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: steeldev
      MYSQL_DATABASE: steel_app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      - ./ddl/07_governance.sql:/docker-entrypoint-initdb.d/07_governance.sql:ro
      - ./ddl/08_billing.sql:/docker-entrypoint-initdb.d/08_billing.sql:ro
      - ./ddl/09_chat_session.sql:/docker-entrypoint-initdb.d/09_chat_session.sql:ro
      - ./ddl/11_briefing.sql:/docker-entrypoint-initdb.d/11_briefing.sql:ro
      - ./ddl/12_scheduled_reports.sql:/docker-entrypoint-initdb.d/12_scheduled_reports.sql:ro
      - ./ddl/13_tenant_notify_config.sql:/docker-entrypoint-initdb.d/13_tenant_notify_config.sql:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: steel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ----------------------- 报表 CRUD API (Java) -----------------------
  report-service:
    build:
      context: ./services/report-service
    container_name: steel-report-service
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/steel_chat?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
      - DB_USER=root
      - DB_PASS=steeldev
      - SCHEDULER_URL=http://report-scheduler:8100
      - TZ=Asia/Shanghai
    depends_on:
      mysql: { condition: service_healthy }
    restart: unless-stopped

  # ----------------------- 报表调度器 -----------------------
  report-scheduler:
    build:
      context: ./services/report-scheduler
    container_name: steel-report-scheduler
    ports:
      - "8100:8100"
    environment:
      - DB_URL=mysql+pymysql://root:steeldev@mysql:3306/steel_chat?charset=utf8mb4
      - DSL_COMPILER_URL=http://dsl-compiler:8000
      - SR_JDBC_URL=jdbc:mysql://starrocks:9030/steel_dw
      - SR_USER=root
      - SR_PASS=
      - TZ=Asia/Shanghai
    depends_on:
      mysql: { condition: service_healthy }
      starrocks: { condition: service_healthy }
    restart: unless-stopped

  # ----------------------- DSL 编译器 -----------------------
  dsl-compiler:
    build:
      context: ./services/dsl-compiler
    container_name: steel-dsl-compiler
    ports:
      - "8000:8000"
    environment:
      - METRICS_DIR=/app/metrics
    volumes:
      - ./metrics:/app/metrics:ro
    depends_on:
      starrocks:
        condition: service_healthy
    restart: unless-stopped

  # ----------------------- 指标注册中心前端 -----------------------
  registry-web:
    image: node:20-alpine
    container_name: steel-registry-web
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./apps/registry-web:/app
      - registry_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8080/api/registry/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

  # ----------------------- uniapp 早报 H5 -----------------------
  briefing-h5:
    image: node:20-alpine
    container_name: steel-briefing-h5
    working_dir: /app
    ports:
      - "5174:5174"
    volumes:
      - ./apps/uniapp-briefing:/app
      - briefing_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE=http://localhost:8080/v1
    command: sh -c "npm install && npm run dev:h5 -- --host 0.0.0.0 --port 5174"
    restart: unless-stopped

volumes:
  sr_data:
  mysql_data:
  redis_data:
  registry_node_modules:
  briefing_node_modules:
